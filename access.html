<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Private preview — GRS Career Consulting</title>
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=202611161900">
  <script src="js/gate.js?v=202611161900"></script>
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
    .gate { position: relative; overflow: hidden; display: grid; place-items: center; padding: 32px var(--gutter) 56px; }
    .gate::before {
      content: ""; position: absolute; pointer-events: none; width: min(820px, 140vw); aspect-ratio: 1;
      left: 50%; top: 50%; transform: translate(-30%, -70%);
      background: radial-gradient(closest-side, rgba(212,242,90,.18), rgba(212,242,90,.04) 55%, transparent 72%);
    }
    .gate::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
      background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1.2px); background-size: 28px 28px;
      mask-image: radial-gradient(60% 60% at 50% 40%, #000, transparent 75%);
      -webkit-mask-image: radial-gradient(60% 60% at 50% 40%, #000, transparent 75%);
    }
    .gate-card { position: relative; z-index: 1; width: 100%; max-width: 520px; }
    .gate h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); margin-bottom: .35em; }
    .gate .lead { margin-bottom: 32px; }
    .gate form { display: flex; gap: 10px; }
    .gate .field { flex: 1; margin: 0; }
    .gate .btn { flex: none; }
    @media (max-width: 480px) { .gate form { flex-direction: column; } .gate .btn { width: 100%; } }
    .gate-error { min-height: 1.5em; margin-top: 12px; color: var(--error); font-size: .92rem; }
    .gate form.shake { animation: shake .4s; }
    @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .gate-foot { padding: 20px var(--gutter) 28px; color: var(--dim); font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="brand" aria-label="GRS Career Consulting">
        <span class="brand-word">GRS</span><span class="brand-dot"></span><span class="brand-sub">coaching</span>
      </span>
    </div>
  </header>

  <main class="gate">
    <div class="gate-card">
      <span class="eyebrow">Private preview</span>
      <h1>This site is <em>in review.</em></h1>
      <p class="lead">Enter the password you were given to view the GRS Career Consulting preview.</p>
      <form id="gate-form" novalidate>
        <div class="field">
          <label for="pw" class="hp">Password</label>
          <input id="pw" name="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
        </div>
        <button type="submit" class="btn btn-accent">Enter
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <p class="gate-error" id="gate-error" role="alert" aria-live="assertive"></p>
    </div>
  </main>

  <footer class="gate-foot">© <span data-year>2026</span> GRS Career Consulting · Confidential preview</footer>

  <script>
    (function () {
      var G = window.GRS_GATE;
      var form = document.getElementById("gate-form");
      var input = document.getElementById("pw");
      var err = document.getElementById("gate-error");
      document.querySelectorAll("[data-year]").forEach(function (el) { el.textContent = new Date().getFullYear(); });

      // only allow redirects to our own pages (e.g. "about.html?utm_source=linkedin")
      var next = new URLSearchParams(location.search).get("next") || "index.html";
      if (!/^[\w-]+\.html([?#].*)?$/.test(next)) next = "index.html";

      function sha256(text) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
          return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
        });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        err.textContent = "";
        if (!input.value) { err.textContent = "Please enter the password."; input.focus(); return; }
        sha256(G.salt + input.value).then(function (h) {
          if (h === G.hash) {
            try { localStorage.setItem(G.key, h); } catch (e1) { try { sessionStorage.setItem(G.key, h); } catch (e2) {} }
            location.replace(next);
          } else {
            err.textContent = "That password isn't right. Please try again.";
            form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
            input.select();
          }
        });
      });
    })();
  </script>
</body>
</html>
